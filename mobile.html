<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="结果先行的企业 AI 获客移动端 H5"><title>企业 AI 获客 · 移动端 H5</title>
<style>
:root{--ink:#172033;--muted:#748094;--bg:#f5f7fa;--card:#fff;--line:#e6eaf0;--blue:#4169e1;--lime:#d7f36b;--soft:#eaf1ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;border:0;cursor:pointer}.mobile-app{max-width:520px;min-height:100vh;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(78px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.brand{font-weight:700;color:var(--ink);font-size:16px}.top button{width:40px;height:40px;border-radius:50%;background:#fff}.hero{margin-top:18px;padding:21px;border-radius:20px;background:var(--ink);color:#fff}.kicker{color:#bfccd9;font-size:12px}.hero h1{margin:9px 0 8px;font-size:25px;line-height:1.25}.hero p{margin:0;color:#d5deeb;font-size:13px}.progress{height:5px;margin:18px 0 13px;border-radius:10px;background:#354052}.progress i{display:block;width:63%;height:100%;border-radius:10px;background:var(--lime)}.primary{width:100%;min-height:48px;border-radius:12px;background:var(--lime);color:var(--ink);font-weight:700}.conversation-link{display:flex;justify-content:center;padding:9px 4px 0;color:#d5deeb;font-size:12px;text-decoration:none}.conversation-link b{color:var(--lime);margin-left:4px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.stat,.card{padding:15px;border-radius:16px;background:var(--card);border:1px solid var(--line)}.stat small{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:21px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 9px}.section-head h2{margin:0;font-size:16px}.section-head a{color:var(--blue);font-size:12px}.task{display:flex;gap:12px;align-items:center;margin-bottom:9px}.task:last-child{margin-bottom:0}.task .num{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:var(--soft);color:var(--blue);font-size:12px;font-weight:700}.task b{display:block;font-size:14px}.task span{display:block;color:var(--muted);font-size:12px}.task button{margin-left:auto;padding:8px 11px;border-radius:9px;background:#f1f3f6;font-size:12px}.result{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.result:last-child{border-bottom:0}.result b{font-size:13px}.result small{display:block;color:var(--muted);font-size:11px}.result button{padding:8px 11px;border-radius:9px;background:var(--ink);color:#fff;font-size:12px}.bottom{position:fixed;bottom:0;left:50%;z-index:5;width:min(520px,100%);transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line)}.bottom button{padding:6px 0;background:transparent;color:var(--muted);font-size:11px}.bottom button.on{color:var(--ink);font-weight:700}.bottom button span{display:block;font-size:20px;line-height:1.2}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);padding:10px 14px;border-radius:10px;background:rgba(23,32,51,.94);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<main class="mobile-app">
  <header class="top"><div><div class="brand">企业 AI 获客</div><div>通用企业 · 蔚然</div></div><button aria-label="消息" onclick="showToast('暂无新的提醒')">铃</button></header>
  <section class="hero"><div class="kicker">结果先行 · 当前最重要 · 企业诊断完成度 63%</div><h1>先把目标客户说清楚</h1><p>完成快速画像，马上得到企业初步诊断和下一步行动建议。</p><div class="progress"><i></i></div><button class="primary" onclick="showToast('打开快速画像（原型演示）')">继续快速画像</button><a class="conversation-link" href="#conversation" onclick="showConversation(event)">不知道怎么填？<b>和 AI 说说企业 →</b></a></section>
  <div class="stats"><div class="stat"><small>已确认信息</small><b>12 项</b></div><div class="stat"><small>待补充信息</small><b>7 项</b></div></div>
  <div class="section-head"><h2>待确认</h2><a onclick="showToast('打开全部待确认')">查看全部</a></div><section class="card"><div class="task"><div class="num">01</div><div><b>品牌定位结论</b><span>AI 分析判断 · 需要负责人确认</span></div><button onclick="showToast('已打开品牌定位')">去确认</button></div><div class="task"><div class="num">02</div><div><b>第三季度经营目标</b><span>涉及预算、负责人和复盘节点</span></div><button onclick="showToast('已打开经营目标')">去确认</button></div></section>
  <div class="section-head"><h2>最近成果</h2><a onclick="showToast('打开成果列表')">全部成果</a></div><section class="card"><div class="result"><div><b>企业品牌诊断报告 v1.2</b><small>品牌与经营 · 今天 10:20</small></div><button onclick="showToast('报告预览（原型演示）')">查看</button></div><div class="result"><div><b>产品讲解 AI 视频</b><small>AI 视频 · 昨天 17:40</small></div><button onclick="showToast('视频预览（原型演示）')">查看</button></div></section>
  <nav class="bottom" aria-label="移动端导航"><button class="on"><span>⌂</span>首页</button><button onclick="showToast('诊断进度')"><span>◌</span>诊断</button><button onclick="showToast('成果列表')"><span>▣</span>成果</button><button onclick="showToast('企业设置')"><span>○</span>我的</button></nav>
</main><div class="toast" id="toast"></div>
<script>let timer;function showToast(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),1800)}function showConversation(event){event.preventDefault();showToast('已进入对话式企业补充（原型演示）')}</script>
</body></html>
